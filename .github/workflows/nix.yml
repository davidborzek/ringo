name: Nix

# The flake is shipped surface — README, docs and the NixOS/home-manager modules
# all point at it — but nothing in CI ever built it, so `flake.nix` could rot
# unnoticed until a user hit it. This job builds both packages the way a
# consumer would.
#
# Path-filtered on purpose: the Nix build compiles the same sources as the
# regular build jobs, so plain Rust changes can't break it in a way `cargo
# build` misses. What *can* break it is a new system dependency or a change to
# the packaging itself — and that always shows up in a manifest, a build script,
# the flake, or the submodule pins.

on:
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .gitmodules
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - crates/**/build.rs
      - .github/workflows/nix.yml

jobs:
  build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      # Deliberately no `submodules:` — the flake copies the vendored C sources
      # from its own `re`/`baresip` inputs, so this job doubles as proof that
      # the Nix path stays independent of the submodule checkout.
      - uses: actions/checkout@v4

      # The same two C libraries are pinned in four places: `branch` in
      # .gitmodules, the tag in the flake.nix input URL, that tag echoed in
      # flake.lock, and the submodule gitlink resolved against flake.lock's
      # locked rev. Nothing forces them to agree, and a partial bump is the
      # realistic failure: Renovate's git-refs datasource and its github-tags
      # datasource can move at different times, which ships a flake pointing at
      # a release the cargo build never compiles.
      #
      # Runs before Nix is even installed, because `nix flake check` reports
      # this as "requires lock file changes but they're not allowed", which
      # names neither the offending input nor the fix.
      - name: Vendored source pins agree
        run: |
          status=0
          fail() { echo "::error file=$1::$2"; status=1; }
          for m in re baresip; do
            submodule=$(git config -f .gitmodules "submodule.vendor/$m.branch")
            flake=$(sed -n "s|.*url = \"github:baresip/$m/\([^\"]*\)\".*|\1|p" flake.nix)
            ref=$(jq -r ".nodes.\"$m\".original.ref" flake.lock)
            rev=$(jq -r ".nodes.\"$m\".locked.rev" flake.lock)
            gitlink=$(git rev-parse "HEAD:crates/ringo-core/vendor/$m")

            if [ "$flake" != "$submodule" ]; then
              fail flake.nix "$m: flake.nix wants $flake but .gitmodules pins $submodule — bump both to the same tag"
            elif [ "$ref" != "$flake" ]; then
              fail flake.lock "$m: flake.lock still locks $ref while flake.nix wants $flake — run \`nix flake update $m\`"
            elif [ "$gitlink" != "$rev" ]; then
              fail flake.lock "$m: submodule checkout is $gitlink but flake.lock resolved $ref to $rev — the submodule was not moved to the tag (\`git -C crates/ringo-core/vendor/$m fetch --tags && git -C crates/ringo-core/vendor/$m checkout $flake\`)"
            fi
          done
          exit $status

      # Upstream Nix. DeterminateSystems/nix-installer-action only installs
      # Determinate Nix since 2026-01-01.
      - uses: cachix/install-nix-action@v31

      # Evaluates every output — packages and devShells for all three declared
      # systems, the overlay, the NixOS module — without building them, so a
      # broken aarch64/darwin branch of mkRingo surfaces on an x86_64 runner.
      # `--no-update-lock-file` fails on a flake.lock that no longer matches
      # flake.nix instead of quietly relocking.
      - run: nix flake check --no-update-lock-file --all-systems

      - run: nix build --print-build-logs --out-link result-phone .#ringo-phone
      - run: nix build --print-build-logs --out-link result-flow .#ringo-flow

      # Same smoke test the release binaries get: the wrapper links and runs.
      - name: Smoke test
        run: |
          ./result-phone/bin/ringo --help
          ./result-flow/bin/ringo-flow --help
