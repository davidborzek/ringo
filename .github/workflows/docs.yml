name: docs

# Build the documentation site and deploy it to GitHub Pages. The whole site is a
# single mdBook (docs/) — a landing page plus one section per tool — mounted at
# davidborzek.github.io/ringo/. Add a tool by dropping a docs/src/<tool>/ section
# and listing it in docs/src/SUMMARY.md; no workflow change needed.
#
# Deploys on release, NOT on every main push — so the live site always matches the
# latest *released* version, not unreleased changes already merged to main. Use
# workflow_dispatch to redeploy manually (e.g. a docs-only fix between releases).
#
# Release-plz calls this via workflow_call after tagging. It does NOT trigger on the
# tag push: release-plz tags with the default GITHUB_TOKEN, and GitHub deliberately
# does not fire workflows for events created by that token (the loop guard). The
# binary/Docker jobs hang off release-plz's `releases` output for the same reason.
on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build the site from (defaults to the calling commit)
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The ringo-flow JS API pages aren't committed — TypeDoc regenerates them from
      # the committed .d.ts on every deploy, so they can't ship stale. Node only; the
      # .d.ts itself comes from the Rust bindings and stays committed (generating it
      # here would mean a full baresip build just to publish docs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No committed package-lock.json (it's gitignored), so no `cache: npm` / `npm ci`.
      - run: npm install --no-save
      - run: npm run docs:js
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build site
        run: mdbook build docs --dest-dir "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
