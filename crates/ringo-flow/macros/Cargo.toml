[package]
name = "ringo-flow-macros"
description = "Proc-macro support for ringo-flow: compile-time TS/JS API metadata for the scenario engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
