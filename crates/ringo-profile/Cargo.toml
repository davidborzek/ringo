[package]
name = "ringo-profile"
description = "ringo profile file format and custom-header templates"
keywords = ["sip", "voip", "baresip", "profile"]
categories = ["config"]
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ringo_profile"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
uuid = { version = "1", features = ["v4"] }
