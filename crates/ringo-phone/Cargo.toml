[package]
name = "ringo-phone"
description = "A terminal SIP softphone built on baresip"
keywords = ["sip", "voip", "baresip", "tui", "phone"]
categories = ["command-line-utilities"]
version = "0.17.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ringo"
path = "src/lib.rs"

[[bin]]
name = "ringo"
path = "src/main.rs"

# `cargo binstall ringo-phone` downloads the release tarball instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/ringo-phone-v{ version }/ringo-{ version }-{ target }.tar.gz"
bin-dir = "ringo-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
ringo-core.workspace = true
ringo-profile.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[build-dependencies]

[features]
default = ["default-audio"]
default-audio = ["ringo-core/default-audio"]
pulse = ["ringo-core/pulse"]
alsa = ["ringo-core/alsa"]
coreaudio = ["ringo-core/coreaudio"]

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
