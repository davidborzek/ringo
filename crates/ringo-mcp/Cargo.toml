[package]
name = "ringo-mcp"
description = "MCP server over stdio exposing ringo SIP agents for LLM-driven telephony"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ringo_mcp"
path = "src/lib.rs"

[[bin]]
name = "ringo-mcp"
path = "src/main.rs"

[dependencies]
ringo-core.workspace = true
ringo-agent.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
toml = "0.9"
rmcp = { version = "3.2", features = ["transport-io"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
# The live-audio WebSocket bridge (see `bridge` module): a small server on a
# loopback listener, plus a client for the integration test.
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
