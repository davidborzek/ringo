[package]
name = "ringo-mcp"
description = "MCP server over stdio exposing ringo SIP agents for LLM-driven telephony"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ringo_mcp"
path = "src/lib.rs"

[[bin]]
name = "ringo-mcp"
path = "src/main.rs"

# `cargo binstall ringo-mcp` downloads the release tarball instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/ringo-mcp-v{ version }/ringo-mcp-{ version }-{ target }.tar.gz"
bin-dir = "ringo-mcp-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
ringo-core.workspace = true
ringo-agent.workspace = true
ringo-profile.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.0"
rmcp = { version = "3.2", features = ["transport-io"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
regex = "1"
tempfile = "3"

